[package]
name = "cxxy-wlanlogin-cli"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
cxxy-wlanlogin-lib.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
ratatui.workspace = true
crossterm.workspace = true
directories.workspace = true
tempfile.workspace = true
fs2.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
dbus-secret-service = { version = "4.1", default-features = false, features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
security-framework-sys = "2"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-wlan = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-system-configuration = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_WiFi", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Console", "Win32_System_SystemInformation"] }
