[workspace]
members = ["crates/wlan-api", "crates/wlan-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cxxy-wlanlogin-lib = { path = "crates/wlan-api" }
reqwest = { version = "0.13", default-features = false, features = ["query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "net", "io-util", "process", "fs"] }

clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29"
keyring = { version = "3.6", default-features = false }
directories = "6"
tempfile = "3"

fs2 = "0.4"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
