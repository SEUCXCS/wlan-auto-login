[workspace]
members = ["crates/wlan-api", "crates/wlan-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cxxy-wlanlogin-lib = { path = "crates/wlan-api" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
