[package]
name = "cxxy-wlanlogin"
version = "0.1.0"
edition = "2024"

[lib]
name = "cxxy_wlanlogin_lib"
path = "src/lib.rs"

[[bin]]
name = "cxxy-wlanlogin-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
