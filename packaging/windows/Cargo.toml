[package]
name = "wlanlogin-installer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[[bin]]
name = "wlanlogin-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "wlanlogin-installer-action"
path = "src/bin/action.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
directories = "6"
tempfile = "3"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Security_Credentials", "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO",
    "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Services",
    "Win32_System_ApplicationInstallationAndServicing", "Win32_System_LibraryLoader", "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell",
    "Win32_Graphics_Gdi", "Win32_System_Rpc", "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
