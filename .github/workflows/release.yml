name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (drafts are supported)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Resolve release source
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Require an existing tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          gh release view --json tagName --jq .tagName -- "$RELEASE_TAG"

      - name: Check out the release tag
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: wlanlogin-linux-x86_64.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: wlanlogin-windows-x86_64.zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: wlanlogin-macos-x86_64.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            asset: wlanlogin-macos-aarch64.tar.gz
    env:
      BUILD_TARGET: ${{ matrix.target }}
      ASSET_NAME: ${{ matrix.asset }}
    steps:
      - name: Check out the resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libdbus-1-dev

      - name: Build Linux and Windows binaries
        if: runner.os != 'macOS'
        run: |
          cargo build --release --locked --package wlanlogin-cli --bin wlanlogin \
            --target "$BUILD_TARGET" --target-dir target

      - name: Build and sign the macOS application bundle
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          cargo xtask bundle macos --profile release --target "$BUILD_TARGET" \
            --target-dir target --codesign-identity=-

      - name: Verify CLI startup
        run: |
          binary="target/$BUILD_TARGET/release/wlanlogin"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="$binary.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            binary="target/$BUILD_TARGET/release/bundle/wlanlogin.app/Contents/MacOS/wlanlogin"
          fi
          "$binary" --version
          "$binary" --help

      - name: Package Linux and macOS assets
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist stage
          cp README.md LICENSE stage/
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp -R "target/$BUILD_TARGET/release/bundle/wlanlogin.app" stage/
          else
            install -m 0755 "target/$BUILD_TARGET/release/wlanlogin" stage/wlanlogin
          fi
          tar -czf "dist/$ASSET_NAME" -C stage .

      - name: Package the Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item "target/$env:BUILD_TARGET/release/wlanlogin.exe", README.md, LICENSE stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/$env:ASSET_NAME"

      - name: Upload the packaged asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  upload:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all packaged assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload to the existing release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload --clobber -- "$RELEASE_TAG" ./*.tar.gz ./*.zip SHA256SUMS
